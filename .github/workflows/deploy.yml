name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grants the GITHUB_TOKEN write permission to publish to Pages, and read
# permission for everything else. Least privilege.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Fails the build (and therefore never produces an artifact) if the
      # authoritative FULL-PLAN.md cannot be found, if TypeScript fails, or
      # if Vite cannot bundle. A failed build must not publish.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck, bundle plan, build
        run: npm run build

      - name: Test
        run: npm test

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
