<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Interactive technical architecture and implementation explorer for Towel (Super RAG) — a multi-app, agent-first RAG platform. Stages 0–15, retrieval stack, security model, and eval plan."
    />
    <title>Towel — Super RAG Architecture Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='6' fill='%230b0e13'/%3E%3Crect x='8' y='9' width='16' height='14' rx='3' fill='%2338cfe4'/%3E%3Crect x='8' y='13' width='16' height='2' fill='%230b0e13' opacity='.35'/%3E%3Crect x='8' y='18' width='16' height='2' fill='%230b0e13' opacity='.35'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      // The site is fully functional with either theme; system preference wins.
      (function () {
        try {
          var saved = localStorage.getItem('towel-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* private mode — keep default dark */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
